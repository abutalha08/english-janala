<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Logo  -->
    <title>English Janala</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />

    <!-- font awesome  -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind + Daisy UI  -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <!-- Stylesheet  -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="min-h-screen max-w-full bg-base-200 mx-auto">
    <!-- Logo  -->
    <div class="flex justify-center items-center gap-1 pt-32">
      <h2 class="text-2xl font-semibold">English</h2>
      <img src="./assets/logo.png" alt="" />
      <h2 class="font-bangla text-2xl font-semibold">জানালা</h2>
    </div>

    <!-- Login Form  -->
    <div class="form pt-10">
      <div
        class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-2xl"
      >
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label font-bold text-neutral">Mobile Number</label>
            <input
              id="input-mobile-number"
              maxlength="11"
              minlength="11"
              type="text"
              class="input rounded-full bg-base-200"
              placeholder="Enter your 11 digit number"
            />

            <br />
            <label class="label font-bold text-neutral">4 Digit Pin</label>
            <input
              id="input-pin-number"
              type="password"
              maxlength="4"
              class="input rounded-full bg-base-200"
              placeholder="Password"
            />

            <button id="login-btn" class="btn btn-primary mt-4 rounded-full">
              Login
            </button>
          </fieldset>
        </div>
      </div>

      <!-- Horizontal Line  -->
      <div class="flex items-center my-4">
        <hr class="grow border-[#E4E4E7] mx-2" />
        <span class="px-2 font-normal text-[16px] text-[#1F2937]">OR</span>
        <hr class="grow border-[#E4E4E7] mx-2" />
      </div>

      <!-- Demo Credentials  -->
      <div>
        <p class="font-normal text-[14px] text-[#64748B] text-center">
          Demo Credentials:
        </p>
      </div>

      <div class="text-center bg-[#F8FAFC] p-7 m-4 rounded">
        <p>
          <span class="font-semibold text-[16px] text-[#1F2937]"
            >Default Number:</span
          >
          01234567890
        </p>
        <p>
          <span class="font-semibold text-[16px] text-[#1F2937]"
            >Default Pin:</span
          >
          1234
        </p>
      </div>
    </div>
    <script src="./script/login.js"></script>
  </body>
</html>
